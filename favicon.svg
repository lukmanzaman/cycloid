<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Gear Metal Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Cyan to Magenta for Rosette -->
    <linearGradient id="curveGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#f355da"/>
    </linearGradient>

    <linearGradient id="curveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Rounded Backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Subtle Radial Ambient Glow Behind Rosette -->
  <circle cx="256" cy="256" r="180" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="120" fill="#ec4899" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Mechanical Gear Teeth Silhouette in Background -->
  <g transform="translate(256, 256)" opacity="0.35">
    <!-- Gear Outer Ring with 16 teeth -->
    <path d="
      M 0 -195 L 14 -195 L 20 -170 L 45 -188 L 56 -180 L 50 -155 L 80 -166 L 90 -154 L 75 -133 L 110 -135 L 118 -120 L 98 -104 L 133 -98 L 138 -82 L 112 -72 L 144 -58 L 146 -41 L 117 -37 L 147 -17 L 146 0
      L 146 17 L 117 37 L 146 41 L 144 58 L 112 72 L 138 82 L 133 98 L 98 104 L 118 120 L 110 135 L 75 133 L 90 154 L 80 166 L 50 155 L 56 180 L 45 188 L 20 170 L 14 195 L 0 195
      L -14 195 L -20 170 L -45 188 L -56 180 L -50 155 L -80 166 L -90 154 L -75 133 L -110 135 L -118 120 L -98 104 L -133 98 L -138 82 L -112 72 L -144 58 L -146 41 L -117 37 L -147 17 L -146 0
      L -146 -17 L -117 -37 L -146 -41 L -144 -58 L -112 -72 L -138 -82 L -133 -98 L -98 -104 L -118 -120 L -110 -135 L -75 -133 L -90 -154 L -80 -166 L -50 -155 L -56 -180 L -45 -188 L -20 -170 L -14 -195 Z
    " fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Pitch circle dashed -->
    <circle cx="0" cy="0" r="165" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 6"/>
  </g>

  <!-- CYCLOID GUILLOCHÉ / SPIROGRAPH ROSETTE -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Layer 1: 8-Lobed Hypocycloid / Epitrochoid Geometric Petals -->
    <g stroke="url(#curveGrad1)" fill="none" stroke-width="2.2" opacity="0.9">
      <path d="M 0,-160 C 95,-160 160,-95 160,0 C 160,95 95,160 0,160 C -95,160 -160,95 -160,0 C -160,-95 -95,-160 0,-160 Z" stroke-dasharray="6 4" stroke-opacity="0.4"/>
      <!-- Harmonic Loops generated with parametric cycloid points -->
      <path d="
        M 0 -168 C 52 -168 119 -119 119 -52 C 119 15 52 84 0 84 C -52 84 -119 15 -119 -52 C -119 -119 -52 -168 0 -168 Z
      " transform="rotate(0)"/>
      <path d="
        M 0 -168 C 52 -168 119 -119 119 -52 C 119 15 52 84 0 84 C -52 84 -119 15 -119 -52 C -119 -119 -52 -168 0 -168 Z
      " transform="rotate(45)"/>
      <path d="
        M 0 -168 C 52 -168 119 -119 119 -52 C 119 15 52 84 0 84 C -52 84 -119 15 -119 -52 C -119 -119 -52 -168 0 -168 Z
      " transform="rotate(90)"/>
      <path d="
        M 0 -168 C 52 -168 119 -119 119 -52 C 119 15 52 84 0 84 C -52 84 -119 15 -119 -52 C -119 -119 -52 -168 0 -168 Z
      " transform="rotate(135)"/>
      <path d="
        M 0 -168 C 52 -168 119 -119 119 -52 C 119 15 52 84 0 84 C -52 84 -119 15 -119 -52 C -119 -119 -52 -168 0 -168 Z
      " transform="rotate(180)"/>
      <path d="
        M 0 -168 C 52 -168 119 -119 119 -52 C 119 15 52 84 0 84 C -52 84 -119 15 -119 -52 C -119 -119 -52 -168 0 -168 Z
      " transform="rotate(225)"/>
      <path d="
        M 0 -168 C 52 -168 119 -119 119 -52 C 119 15 52 84 0 84 C -52 84 -119 15 -119 -52 C -119 -119 -52 -168 0 -168 Z
      " transform="rotate(270)"/>
      <path d="
        M 0 -168 C 52 -168 119 -119 119 -52 C 119 15 52 84 0 84 C -52 84 -119 15 -119 -52 C -119 -119 -52 -168 0 -168 Z
      " transform="rotate(315)"/>
    </g>

    <!-- Layer 2: Intricate Inner Crimson/Pink Guilloché Stars -->
    <g stroke="url(#curveGrad2)" fill="none" stroke-width="1.8" opacity="0.95">
      <path d="
        M 0 -140 C 40 -90 120 -60 90 0 C 60 60 40 120 0 100 C -40 120 -60 60 -90 0 C -120 -60 -40 -90 0 -140 Z
      " transform="rotate(22.5)"/>
      <path d="
        M 0 -140 C 40 -90 120 -60 90 0 C 60 60 40 120 0 100 C -40 120 -60 60 -90 0 C -120 -60 -40 -90 0 -140 Z
      " transform="rotate(67.5)"/>
      <path d="
        M 0 -140 C 40 -90 120 -60 90 0 C 60 60 40 120 0 100 C -40 120 -60 60 -90 0 C -120 -60 -40 -90 0 -140 Z
      " transform="rotate(112.5)"/>
      <path d="
        M 0 -140 C 40 -90 120 -60 90 0 C 60 60 40 120 0 100 C -40 120 -60 60 -90 0 C -120 -60 -40 -90 0 -140 Z
      " transform="rotate(157.5)"/>
      <path d="
        M 0 -140 C 40 -90 120 -60 90 0 C 60 60 40 120 0 100 C -40 120 -60 60 -90 0 C -120 -60 -40 -90 0 -140 Z
      " transform="rotate(202.5)"/>
      <path d="
        M 0 -140 C 40 -90 120 -60 90 0 C 60 60 40 120 0 100 C -40 120 -60 60 -90 0 C -120 -60 -40 -90 0 -140 Z
      " transform="rotate(247.5)"/>
      <path d="
        M 0 -140 C 40 -90 120 -60 90 0 C 60 60 40 120 0 100 C -40 120 -60 60 -90 0 C -120 -60 -40 -90 0 -140 Z
      " transform="rotate(292.5)"/>
      <path d="
        M 0 -140 C 40 -90 120 -60 90 0 C 60 60 40 120 0 100 C -40 120 -60 60 -90 0 C -120 -60 -40 -90 0 -140 Z
      " transform="rotate(337.5)"/>
    </g>
  </g>

  <!-- Mechanical Kinematic Pen Arm & Pivot -->
  <g stroke-linecap="round">
    <!-- Connecting Rod Linkage -->
    <line x1="120" y1="360" x2="330" y2="150" stroke="#0ea5e9" stroke-width="4" opacity="0.8"/>
    <!-- Pen Arm Extension -->
    <line x1="330" y1="150" x2="380" y2="190" stroke="#f43f5e" stroke-width="3.5"/>
    
    <!-- Fulcrum Pivot Point 1 -->
    <circle cx="120" cy="360" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <!-- Linkage Pivot Point 2 -->
    <circle cx="330" cy="150" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Glowing Pen Nib on Curve -->
    <circle cx="380" cy="190" r="14" fill="#ec4899" opacity="0.3" filter="url(#glow)"/>
    <circle cx="380" cy="190" r="6" fill="#ec4899" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Center Turntable Hub Bearing -->
  <circle cx="256" cy="256" r="28" fill="#0b0f19" stroke="#38bdf8" stroke-width="3.5"/>
  <circle cx="256" cy="256" r="16" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>
</svg>
